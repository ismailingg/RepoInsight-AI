# render.yaml — Render Blueprint for RepoInsight AI
# Vectors: Qdrant Cloud (qdrant.tech)
# Database: Neon (neon.tech)
# Frontend: Streamlit Community Cloud (share.streamlit.io)
# Both DB and Qdrant are set manually as env vars in the Render dashboard

services:

  # ── FastAPI Backend ─────────────────────────────────────────────
  - type: web
    name: repoinsight-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.Main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: TEMP_REPOS_PATH
        value: /tmp/repos
      - key: DATABASE_URL
        sync: false               # paste Neon connection string
      - key: QDRANT_URL
        sync: false               # paste Qdrant Cloud cluster URL
      - key: QDRANT_API_KEY
        sync: false               # paste Qdrant Cloud API key
      - key: SECRET_KEY
        generateValue: true
      - key: APP_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false               # your Streamlit Cloud URL e.g. https://repoinsight.streamlit.app
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false