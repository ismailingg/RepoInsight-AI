# render.yaml — Render Blueprint for RepoInsight AI
# Vectors: Qdrant Cloud (qdrant.tech)
# Database: Neon (neon.tech)
# Both are set manually as env vars in the Render dashboard

services:

  # ── FastAPI Backend ─────────────────────────────────────────────
  - type: web
    name: repoinsight-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.Main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: TEMP_REPOS_PATH
        value: /tmp/repos         # ephemeral is fine — repos are cloned and deleted per-ingest
      - key: DATABASE_URL
        sync: false               # paste Neon connection string
      - key: QDRANT_URL
        sync: false               # paste Qdrant Cloud cluster URL
      - key: QDRANT_API_KEY
        sync: false               # paste Qdrant Cloud API key
      - key: SECRET_KEY
        generateValue: true
      - key: APP_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false               # e.g. https://repoinsight-frontend.onrender.com
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        value: "RepoInsight AI"

  # ── Streamlit Frontend ──────────────────────────────────────────
  - type: web
    name: repoinsight-frontend
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: API_BASE
        sync: false               # e.g. https://repoinsight-backend.onrender.com